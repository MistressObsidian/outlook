<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6fb;
      color: #111;
      margin: 0;
      min-height: 100vh;
    }
    .page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 24px;
    }
    header h1 {
      margin: 0;
      font-size: 2rem;
    }
    .toolbar {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    button {
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      cursor: pointer;
      color: white;
      background: #2563eb;
      font-size: 0.95rem;
    }
    button:hover {
      background: #1d4ed8;
    }
    .panel {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      padding: 20px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }
    th, td {
      text-align: left;
      padding: 14px 12px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 0.95rem;
    }
    th {
      color: #374151;
      background: #f9fafb;
    }
    .status {
      margin-top: 12px;
      font-size: 0.95rem;
      color: #374151;
    }
    .empty-state {
      margin: 24px 0;
      color: #6b7280;
    }
    .top-link {
      color: #2563eb;
      text-decoration: none;
      font-weight: 500;
    }
    .top-link:hover {
      text-decoration: underline;
    }
    .form-group {
      display: grid;
      gap: 10px;
      margin-bottom: 16px;
    }
    .form-group label {
      font-size: 0.9rem;
      color: #374151;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      padding: 12px;
      font-size: 0.95rem;
      color: #111;
      background: #fff;
      resize: vertical;
    }
    .form-group textarea {
      min-height: 160px;
    }
    .message-row {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 12px;
    }
    .message-row span {
      color: #374151;
      font-size: 0.95rem;
    }
    .send-status {
      margin-top: 12px;
      color: #2563eb;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div>
        <h1>Admin Dashboard</h1>
        <p>View submission records and confirm your API is working.</p>
      </div>
      <div class="toolbar">
        <button id="refreshBtn">Refresh submissions</button>
        <a class="top-link" href="/">Return home</a>
      </div>
    </header>

    <section class="panel">
      <h2>Send manual email</h2>
      <div class="form-group">
        <label for="emailTo">To</label>
        <input id="emailTo" type="email" placeholder="recipient@example.com" />
      </div>
      <div class="form-group">
        <label for="emailSubject">Subject</label>
        <input id="emailSubject" type="text" placeholder="Email subject" />
      </div>
      <div class="form-group">
        <label for="emailBody">Message</label>
        <textarea id="emailBody" placeholder="Write your email message here..."></textarea>
      </div>
      <div class="message-row">
        <button id="sendEmailBtn">Send email</button>
        <span id="emailSendStatus">Ready to send.</span>
      </div>
    </section>

    <section class="panel">
      <h2>Submission records</h2>
      <div class="status" id="status">Loading submissions…</div>
      <table id="submissionsTable" style="display:none;">
        <thead>
          <tr>
            <th>ID</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Created at</th>
          </tr>
        </thead>
        <tbody id="submissionsBody"></tbody>
      </table>
      <div class="empty-state" id="emptyState" style="display:none;">
        No submissions found yet.
      </div>
    </section>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const tableEl = document.getElementById('submissionsTable');
    const bodyEl = document.getElementById('submissionsBody');
    const emptyEl = document.getElementById('emptyState');
    const refreshBtn = document.getElementById('refreshBtn');

    async function loadSubmissions() {
      statusEl.textContent = 'Loading submissions…';
      tableEl.style.display = 'none';
      emptyEl.style.display = 'none';

      try {
        const response = await fetch('/admin/submissions');
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Unable to fetch submissions');
        }

        if (!data.submissions || data.submissions.length === 0) {
          statusEl.textContent = 'No submissions found.';
          emptyEl.style.display = 'block';
          return;
        }

        bodyEl.innerHTML = data.submissions.map(item => `
          <tr>
            <td>${item.id}</td>
            <td>${item.email || '-'}</td>
            <td>${item.phone || '-'}</td>
            <td>${new Date(item.created_at).toLocaleString()}</td>
          </tr>
        `).join('');

        statusEl.textContent = `Loaded ${data.submissions.length} submission(s).`;
        tableEl.style.display = 'table';
      } catch (error) {
        statusEl.textContent = `Error: ${error.message}`;
      }
    }

    const emailToInput = document.getElementById('emailTo');
    const emailSubjectInput = document.getElementById('emailSubject');
    const emailBodyInput = document.getElementById('emailBody');
    const sendEmailBtn = document.getElementById('sendEmailBtn');
    const emailSendStatus = document.getElementById('emailSendStatus');

    async function sendEmail() {
      const to = emailToInput.value.trim();
      const subject = emailSubjectInput.value.trim();
      const message = emailBodyInput.value.trim();

      if (!to || !subject || !message) {
        emailSendStatus.textContent = 'Please fill in To, Subject, and Message.';
        return;
      }

      sendEmailBtn.disabled = true;
      emailSendStatus.textContent = 'Sending email…';

      try {
        const response = await fetch('/admin/send-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ to, subject, message })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Failed to send email');

        emailSendStatus.textContent = 'Email sent successfully.';
        emailToInput.value = '';
        emailSubjectInput.value = '';
        emailBodyInput.value = '';
      } catch (error) {
        emailSendStatus.textContent = `Error: ${error.message}`;
      } finally {
        sendEmailBtn.disabled = false;
      }
    }

    sendEmailBtn.addEventListener('click', sendEmail);
    refreshBtn.addEventListener('click', loadSubmissions);
    loadSubmissions();
  </script>
</body>
</html>
